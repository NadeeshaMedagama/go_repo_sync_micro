name: Scheduled Sync

on:
  schedule:
    # Run daily at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      incremental:
        description: 'Run incremental sync (only changed files)'
        required: false
        default: true
        type: boolean
      project_id:
        description: 'Project ID to sync (default: all projects)'
        required: false
        default: 'default'
        type: string
      max_duration:
        description: 'Maximum sync duration in minutes (default: 150)'
        required: false
        default: '150'
        type: string
      debug_mode:
        description: 'Enable verbose debug logging'
        required: false
        default: false
        type: boolean
      repo_filter:
        description: 'Filter repositories by name pattern (optional, e.g., "api-*")'
        required: false
        default: ''
        type: string
      max_repos:
        description: 'Maximum number of repositories to process (0 = unlimited)'
        required: false
        default: '50'
        type: string
      max_files_per_repo:
        description: 'Maximum files to process per repository (0 = unlimited)'
        required: false
        default: '100'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Prevent concurrent runs from interfering
    concurrency:
      group: sync-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Create directories
        run: |
          mkdir -p data logs

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build services
        run: |
          go build -o bin/orchestrator ./services/orchestrator
          go build -o bin/metadata ./services/metadata
          go build -o bin/github-discovery ./services/github-discovery
          go build -o bin/document-processor ./services/document-processor
          go build -o bin/embedding ./services/embedding
          go build -o bin/vector-storage ./services/vector-storage
          go build -o bin/notification ./services/notification

      - name: Start metadata service
        run: |
          nohup ./bin/metadata > ./logs/metadata-stdout.log 2>&1 &
          echo "Waiting for metadata service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9086/health > /dev/null 2>&1; then
              echo "✓ Metadata service is ready"
              break
            fi
            echo "Waiting for metadata service... ($i/30)"
            sleep 2
          done
        env:
          METADATA_DB_PATH: ./data/metadata.db
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/metadata.log
          METADATA_SERVICE_PORT: 9086
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start GitHub discovery service
        run: |
          echo "Starting GitHub discovery service..."
          nohup ./bin/github-discovery > ./logs/github-discovery-stdout.log 2>&1 &
          GITHUB_PID=$!
          disown $GITHUB_PID
          echo $GITHUB_PID > ./github-discovery.pid
          echo "GitHub discovery service started with PID: $GITHUB_PID"
          
          echo "Waiting for GitHub discovery service to start..."
          for i in {1..30}; do
            # Check if process is still running
            if ! kill -0 $GITHUB_PID 2>/dev/null; then
              echo "ERROR: GitHub discovery service crashed!"
              echo "--- Stdout/Stderr log ---"
              cat ./logs/github-discovery-stdout.log 2>/dev/null || echo "No stdout log"
              echo "--- Service log ---"
              cat ./logs/github.log 2>/dev/null || echo "No service log"
              exit 1
            fi
            
            if curl -sf http://localhost:9081/health > /dev/null 2>&1; then
              echo "✓ GitHub discovery service is ready"
              break
            fi
            echo "Waiting for GitHub discovery service... ($i/30)"
            sleep 2
          done
          
          # Final check
          if ! curl -sf http://localhost:9081/health > /dev/null 2>&1; then
            echo "ERROR: GitHub discovery service failed to become healthy"
            echo "--- Stdout/Stderr log ---"
            cat ./logs/github-discovery-stdout.log 2>/dev/null || echo "No stdout log"
            echo "--- Service log ---"
            cat ./logs/github.log 2>/dev/null || echo "No service log"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          GH_FILTER_KEYWORD: ${{ secrets.GH_FILTER_KEYWORD }}
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/github.log
          GITHUB_SERVICE_PORT: 9081
          # Required by config validation
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start document processor service
        run: |
          nohup ./bin/document-processor > ./logs/document-processor-stdout.log 2>&1 &
          echo "Waiting for document processor service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9082/health > /dev/null 2>&1; then
              echo "✓ Document processor service is ready"
              break
            fi
            echo "Waiting for document processor service... ($i/30)"
            sleep 2
          done
        env:
          MAX_CHUNK_SIZE: 1000
          CHUNK_OVERLAP: 200
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/document-processor.log
          DOCUMENT_PROCESSOR_PORT: 9082
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start embedding service
        run: |
          nohup ./bin/embedding > ./logs/embedding-stdout.log 2>&1 &
          echo "Waiting for embedding service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9083/health > /dev/null 2>&1; then
              echo "✓ Embedding service is ready"
              break
            fi
            echo "Waiting for embedding service... ($i/30)"
            sleep 2
          done
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/embedding.log
          EMBEDDING_SERVICE_PORT: 9083
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start vector storage service
        run: |
          nohup ./bin/vector-storage > ./logs/vector-storage-stdout.log 2>&1 &
          echo "Waiting for vector storage service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9084/health > /dev/null 2>&1; then
              echo "✓ Vector storage service is ready"
              break
            fi
            echo "Waiting for vector storage service... ($i/30)"
            sleep 2
          done
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_DIMENSION: 1536
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/vector-storage.log
          VECTOR_STORAGE_PORT: 9084
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

      - name: Start notification service
        run: |
          nohup ./bin/notification > ./logs/notification-stdout.log 2>&1 &
          echo "Waiting for notification service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9085/health > /dev/null 2>&1; then
              echo "✓ Notification service is ready"
              break
            fi
            echo "Waiting for notification service... ($i/30)"
            sleep 2
          done
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/notification.log
          NOTIFICATION_SERVICE_PORT: 9085
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start orchestrator service
        run: |
          echo "Starting orchestrator service..."
          nohup ./bin/orchestrator > ./logs/orchestrator-stdout.log 2>&1 &
          ORCH_PID=$!
          disown $ORCH_PID
          echo $ORCH_PID > ./orchestrator.pid
          echo "Orchestrator service started with PID: $ORCH_PID"
          
          echo "Waiting for orchestrator service to start..."
          for i in {1..30}; do
            # Check if process is still running
            if ! kill -0 $ORCH_PID 2>/dev/null; then
              echo "ERROR: Orchestrator service crashed!"
              echo "--- Stdout/Stderr log ---"
              cat ./logs/orchestrator-stdout.log 2>/dev/null || echo "No stdout log"
              echo "--- Service log ---"
              cat ./logs/orchestrator.log 2>/dev/null || echo "No service log"
              exit 1
            fi
            
            if curl -sf http://localhost:9090/health > /dev/null 2>&1; then
              echo "✓ Orchestrator service is ready"
              break
            fi
            echo "Waiting for orchestrator service... ($i/30)"
            sleep 2
          done
          
          # Final check
          if ! curl -sf http://localhost:9090/health > /dev/null 2>&1; then
            echo "ERROR: Orchestrator service failed to become healthy"
            echo "--- Stdout/Stderr log ---"
            cat ./logs/orchestrator-stdout.log 2>/dev/null || echo "No stdout log"
            echo "--- Service log ---"
            cat ./logs/orchestrator.log 2>/dev/null || echo "No service log"
            exit 1
          fi
        env:
          GITHUB_SERVICE_URL: http://localhost:9081
          DOCUMENT_PROCESSOR_URL: http://localhost:9082
          EMBEDDING_SERVICE_URL: http://localhost:9083
          VECTOR_STORAGE_URL: http://localhost:9084
          NOTIFICATION_SERVICE_URL: http://localhost:9085
          METADATA_SERVICE_URL: http://localhost:9086
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          GH_FILTER_KEYWORD: ${{ secrets.GH_FILTER_KEYWORD }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/orchestrator.log
          ORCHESTRATOR_PORT: 9090
          # Processing limits to prevent resource exhaustion
          MAX_WORKERS: 2
          EMBEDDING_BATCH_SIZE: 25
          RATE_LIMIT_REQUESTS_PER_MINUTE: 20
          # Memory-aware limits
          MAX_REPOS: ${{ github.event.inputs.max_repos || '50' }}
          MAX_FILES_PER_REPO: ${{ github.event.inputs.max_files_per_repo || '100' }}
          # Go garbage collection tuning
          GOGC: 50
          GOMEMLIMIT: 12GiB

      - name: Wait for services to be healthy
        run: |
          echo "Checking all services health..."
          
          # Define all services to check
          declare -A services=(
            ["metadata"]="http://localhost:9086/health"
            ["github-discovery"]="http://localhost:9081/health"
            ["document-processor"]="http://localhost:9082/health"
            ["embedding"]="http://localhost:9083/health"
            ["vector-storage"]="http://localhost:9084/health"
            ["notification"]="http://localhost:9085/health"
            ["orchestrator"]="http://localhost:9090/health"
          )
          
          all_healthy=false
          for i in {1..30}; do
            all_healthy=true
            for service in "${!services[@]}"; do
              if ! curl -sf "${services[$service]}" > /dev/null 2>&1; then
                echo "  ✗ $service not ready"
                all_healthy=false
              else
                echo "  ✓ $service is healthy"
              fi
            done
            
            if [ "$all_healthy" = true ]; then
              echo "All services are healthy!"
              break
            fi
            
            echo "Waiting for all services to be healthy... ($i/30)"
            sleep 3
          done
          
          if [ "$all_healthy" != true ]; then
            echo "ERROR: Not all services became healthy in time"
            echo "Service status:"
            for service in "${!services[@]}"; do
              if curl -sf "${services[$service]}" > /dev/null 2>&1; then
                echo "  ✓ $service: healthy"
              else
                echo "  ✗ $service: unhealthy"
                # Show logs for unhealthy services
                if [ "$service" = "github-discovery" ]; then
                  echo "--- GitHub Discovery stdout log ---"
                  cat ./logs/github-discovery-stdout.log 2>/dev/null || echo "No stdout log"
                  echo "--- GitHub Discovery service log ---"
                  tail -50 ./logs/github.log 2>/dev/null || echo "No service log"
                  echo "--- Checking if process is running ---"
                  if [ -f ./github-discovery.pid ]; then
                    PID=$(cat ./github-discovery.pid)
                    if kill -0 $PID 2>/dev/null; then
                      echo "Process $PID is still running"
                    else
                      echo "Process $PID has crashed"
                    fi
                  fi
                fi
              fi
            done
            exit 1
          fi

      - name: Pre-sync diagnostics
        run: |
          echo "=== Pre-sync System Diagnostics ==="
          echo "Memory usage:"
          free -m
          echo ""
          echo "Running service processes:"
          ps aux | grep -E "(orchestrator|metadata|github-discovery|document-processor|embedding|vector-storage|notification)" | grep -v grep || echo "No service processes found"
          echo ""
          echo "Disk usage:"
          df -h .
          echo ""
          echo "Service PIDs:"
          for pidfile in ./*.pid; do
            if [ -f "$pidfile" ]; then
              name=$(basename "$pidfile" .pid)
              pid=$(cat "$pidfile")
              if kill -0 $pid 2>/dev/null; then
                echo "  $name: PID $pid (running)"
              else
                echo "  $name: PID $pid (NOT running)"
              fi
            fi
          done
          echo "=== End Diagnostics ==="

      - name: Trigger sync
        timeout-minutes: 160
        run: |
          # Function to dump diagnostics
          dump_diagnostics() {
            echo "=== Diagnostic Information ==="
            echo "Running processes:"
            ps aux | grep -E "(orchestrator|metadata|github-discovery|document-processor|embedding|vector-storage|notification)" | grep -v grep || echo "No service processes found"
            echo ""
            echo "Memory usage:"
            free -m
            echo ""
            echo "Service PIDs:"
            for pidfile in ./*.pid; do
              if [ -f "$pidfile" ]; then
                name=$(basename "$pidfile" .pid)
                pid=$(cat "$pidfile")
                if kill -0 $pid 2>/dev/null; then
                  echo "  $name: PID $pid (running)"
                else
                  echo "  $name: PID $pid (NOT running - CRASHED)"
                fi
              fi
            done
            echo ""
            echo "Recent orchestrator logs (last 50 lines):"
            tail -50 ./logs/orchestrator.log 2>/dev/null || echo "No orchestrator logs"
            echo ""
            echo "Recent orchestrator stdout (last 30 lines):"
            tail -30 ./logs/orchestrator-stdout.log 2>/dev/null || echo "No stdout log"
            echo "=== End Diagnostics ==="
          }
          
          # Function to check if critical services are running
          check_services() {
            local all_running=true
            for svc in orchestrator:9090 github-discovery:9081; do
              name="${svc%:*}"
              port="${svc#*:}"
              if ! curl -sf "http://localhost:$port/health" > /dev/null 2>&1; then
                echo "[ERROR] Service $name is not responding!"
                all_running=false
              fi
            done
            $all_running
          }
          
          # Trap SIGTERM for graceful shutdown
          cleanup() {
            echo ""
            echo "SIGTERM received! Initiating graceful shutdown..."
            dump_diagnostics
            
            # Try to gracefully stop services
            echo "Stopping services gracefully..."
            for pidfile in ./*.pid; do
              if [ -f "$pidfile" ]; then
                pid=$(cat "$pidfile")
                if kill -0 $pid 2>/dev/null; then
                  kill -TERM $pid 2>/dev/null || true
                fi
              fi
            done
            
            # Give services time to shutdown
            sleep 5
            
            exit 143
          }
          trap cleanup SIGTERM SIGINT
          
          INCREMENTAL="${{ github.event.inputs.incremental || 'true' }}"
          PROJECT_ID="${{ github.event.inputs.project_id || 'default' }}"
          MAX_DURATION="${{ github.event.inputs.max_duration || '150' }}"
          DEBUG_MODE="${{ github.event.inputs.debug_mode || 'false' }}"
          REPO_FILTER="${{ github.event.inputs.repo_filter || '' }}"
          MAX_REPOS="${{ github.event.inputs.max_repos || '50' }}"
          MAX_FILES_PER_REPO="${{ github.event.inputs.max_files_per_repo || '100' }}"
          
          # Convert minutes to seconds for curl
          MAX_SECONDS=$((MAX_DURATION * 60))
          
          echo "=========================================="
          echo "Starting sync with parameters:"
          echo "  - Incremental: $INCREMENTAL"
          echo "  - Project ID: $PROJECT_ID"
          echo "  - Max duration: ${MAX_DURATION}m (${MAX_SECONDS}s)"
          echo "  - Debug mode: $DEBUG_MODE"
          echo "  - Repo filter: ${REPO_FILTER:-'(none)'}"
          echo "  - Max repos: $MAX_REPOS"
          echo "  - Max files per repo: $MAX_FILES_PER_REPO"
          echo "  - Start time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          
          if [ "$DEBUG_MODE" = "true" ]; then
            echo "Debug mode enabled - verbose logging active"
          fi
          echo "Current memory usage:"
          free -m || true
          
          # Verify all services are running before making request
          echo ""
          echo "Verifying all services are healthy before sync..."
          if ! check_services; then
            echo "Error: Not all services are responding"
            dump_diagnostics
            echo '{"success": false, "errors": ["One or more services are not responding before sync"]}' > sync-result.json
            exit 1
          fi
          echo "All critical services are healthy, proceeding with sync..."
          
          # Start background memory and health monitor
          (
            iteration=0
            high_mem_count=0
            while true; do
              iteration=$((iteration + 1))
              MEM_USED=$(free -m | awk '/^Mem:/{print $3}')
              MEM_TOTAL=$(free -m | awk '/^Mem:/{print $2}')
              MEM_PCT=$((MEM_USED * 100 / MEM_TOTAL))
              
              # Check memory usage - warn at 80%, critical at 90%
              if [ $MEM_PCT -gt 90 ]; then
                high_mem_count=$((high_mem_count + 1))
                echo "[Monitor $(date '+%H:%M:%S')] CRITICAL: Memory at ${MEM_PCT}% (${MEM_USED}MB / ${MEM_TOTAL}MB) - count: $high_mem_count"
                # If memory is critical for 3+ consecutive checks, try to free memory
                if [ $high_mem_count -ge 3 ]; then
                  echo "[Monitor] Attempting to trigger Go GC via signal..."
                  # Force Go services to run GC by sending SIGUSR1 (if they handle it)
                  for pidfile in ./*.pid; do
                    if [ -f "$pidfile" ]; then
                      pid=$(cat "$pidfile")
                      kill -USR1 $pid 2>/dev/null || true
                    fi
                  done
                  sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
                fi
              elif [ $MEM_PCT -gt 80 ]; then
                echo "[Monitor $(date '+%H:%M:%S')] WARNING: High memory usage: ${MEM_USED}MB / ${MEM_TOTAL}MB (${MEM_PCT}%)"
                high_mem_count=0
              else
                high_mem_count=0
              fi
              
              # Check service health every 2 minutes (4 iterations * 30s)
              if [ $((iteration % 4)) -eq 0 ]; then
                echo "[Monitor $(date '+%H:%M:%S')] Periodic health check..."
                services_ok=true
                for svc in orchestrator:9090 github-discovery:9081 embedding:9083 vector-storage:9084; do
                  name="${svc%:*}"
                  port="${svc#*:}"
                  if curl -sf "http://localhost:$port/health" > /dev/null 2>&1; then
                    echo "[Monitor]   ✓ $name: healthy"
                  else
                    echo "[Monitor]   ✗ $name: UNHEALTHY!"
                    services_ok=false
                  fi
                done
                
                if [ "$services_ok" = "false" ]; then
                  echo "[Monitor] WARNING: One or more services have crashed!"
                  echo "[Monitor] Dumping service logs..."
                  tail -20 ./logs/orchestrator.log 2>/dev/null || true
                fi
              fi
              
              sleep 30
            done
          ) &
          MONITOR_PID=$!
          
          # Build the sync URL with optional parameters
          SYNC_URL="http://localhost:9090/sync?project_id=$PROJECT_ID&incremental=$INCREMENTAL"
          if [ -n "$REPO_FILTER" ]; then
            SYNC_URL="${SYNC_URL}&repo_filter=$(echo "$REPO_FILTER" | jq -sRr @uri)"
          fi
          if [ "$MAX_REPOS" != "0" ] && [ -n "$MAX_REPOS" ]; then
            SYNC_URL="${SYNC_URL}&max_repos=$MAX_REPOS"
          fi
          if [ "$MAX_FILES_PER_REPO" != "0" ] && [ -n "$MAX_FILES_PER_REPO" ]; then
            SYNC_URL="${SYNC_URL}&max_files_per_repo=$MAX_FILES_PER_REPO"
          fi
          
          # Make the sync request with configurable timeout
          echo ""
          echo "Starting sync request with ${MAX_DURATION} minute timeout..."
          echo "Sync URL: $SYNC_URL"
          echo "Request started at: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          
          HTTP_CODE=$(curl -s -X POST "$SYNC_URL" \
            -H "Content-Type: application/json" \
            --connect-timeout 30 \
            --max-time $MAX_SECONDS \
            -o sync-result.json \
            -w "%{http_code}") || CURL_EXIT_CODE=$?
          
          # Stop memory monitor
          kill $MONITOR_PID 2>/dev/null || true
          
          CURL_EXIT_CODE=${CURL_EXIT_CODE:-0}
          echo ""
          echo "=========================================="
          echo "Sync request completed at: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Curl exit code: $CURL_EXIT_CODE"
          echo "HTTP Status: $HTTP_CODE"
          echo "=========================================="
          echo ""
          echo "Final memory usage:"
          free -m || true
          
          # Check service health after sync attempt
          echo ""
          echo "Checking services health after sync..."
          crashed_services=""
          for service in metadata:9086 github-discovery:9081 document-processor:9082 embedding:9083 vector-storage:9084 notification:9085 orchestrator:9090; do
            name="${service%:*}"
            port="${service#*:}"
            if curl -sf "http://localhost:$port/health" > /dev/null 2>&1; then
              echo "  ✓ $name is still running"
            else
              echo "  ✗ $name has crashed or is unresponsive"
              crashed_services="$crashed_services $name"
              # Show crash logs
              echo "    --- $name stdout log (last 20 lines) ---"
              tail -20 ./logs/${name}-stdout.log 2>/dev/null || echo "    No stdout log available"
            fi
          done
          
          # If services crashed, dump more diagnostics
          if [ -n "$crashed_services" ]; then
            echo ""
            echo "WARNING: The following services crashed during sync:$crashed_services"
            echo ""
            echo "=== Detailed Crash Analysis ==="
            dump_diagnostics
          fi
          
          # Handle curl-specific exit codes
          if [ $CURL_EXIT_CODE -eq 28 ]; then
            echo "Error: Sync operation timed out after $MAX_DURATION minutes"
            echo "{\"success\": false, \"errors\": [\"Sync operation timed out after ${MAX_DURATION} minutes - consider using repo_filter to reduce scope\"]}" > sync-result.json
          elif [ $CURL_EXIT_CODE -eq 7 ]; then
            echo "Error: Failed to connect to orchestrator service"
            if [ -n "$crashed_services" ]; then
              echo "{\"success\": false, \"errors\": [\"Connection refused - services crashed during sync: $crashed_services\"]}" > sync-result.json
            else
              echo '{"success": false, "errors": ["Connection refused - orchestrator service may have crashed"]}' > sync-result.json
            fi
          elif [ $CURL_EXIT_CODE -eq 56 ]; then
            echo "Error: Connection reset by peer - service may have crashed during sync"
            echo "{\"success\": false, \"errors\": [\"Connection reset - services that crashed: $crashed_services\"]}" > sync-result.json
          elif [ ! -s sync-result.json ]; then
            echo "Error: No response received from sync endpoint"
            echo '{"success": false, "errors": ["No response from orchestrator"]}' > sync-result.json
          fi
          
          # Display the result
          cat sync-result.json | jq '.' 2>/dev/null || cat sync-result.json
          
          # Show logs if sync failed
          if [ "$HTTP_CODE" -ge 400 ] || [ "$HTTP_CODE" = "000" ] || [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "--- Orchestrator logs (last 50 lines) ---"
            tail -50 ./logs/orchestrator.log 2>/dev/null || echo "No orchestrator logs available"
            echo "--- End of logs ---"
          fi
          
          # Fail if HTTP status indicates an error or curl failed
          if [ "$HTTP_CODE" -ge 400 ] || [ "$HTTP_CODE" = "000" ] || [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Error: Sync request failed (HTTP: $HTTP_CODE, curl: $CURL_EXIT_CODE)"
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Upload sync result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-result-${{ github.run_number }}
          path: sync-result.json
          retention-days: 30

      - name: Check sync result
        run: |
          # Validate that sync-result.json exists and is valid JSON
          if [ ! -f sync-result.json ]; then
            echo "Error: sync-result.json not found"
            exit 1
          fi
          
          if ! jq empty sync-result.json 2>/dev/null; then
            echo "Error: sync-result.json is not valid JSON"
            cat sync-result.json
            exit 1
          fi
          
          SUCCESS=$(jq -r '.success // false' sync-result.json)
          if [ "$SUCCESS" != "true" ]; then
            echo "Sync failed!"
            echo "Errors:"
            jq -r '.errors[]? // "No error details available"' sync-result.json
            echo "Warnings:"
            jq -r '.warnings[]? // empty' sync-result.json
            exit 1
          fi
          echo "Sync completed successfully!"
          echo "Summary:"
          jq '{repositories_scanned: .repositories_scanned, files_processed: .files_processed, embeddings_generated: .embeddings_generated, duration: .duration}' sync-result.json || true

      - name: Cleanup background processes
        if: always()
        run: |
          echo "Stopping background services..."
          pkill -f "./bin/orchestrator" || true
          pkill -f "./bin/metadata" || true
          pkill -f "./bin/github-discovery" || true
          pkill -f "./bin/document-processor" || true
          pkill -f "./bin/embedding" || true
          pkill -f "./bin/vector-storage" || true
          pkill -f "./bin/notification" || true
          echo "All services stopped"


name: Scheduled Sync

on:
  schedule:
    # Run daily at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      incremental:
        description: 'Run incremental sync (only changed files)'
        required: false
        default: true
        type: boolean
      project_id:
        description: 'Project ID to sync (default: all projects)'
        required: false
        default: 'default'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Create directories
        run: |
          mkdir -p data logs

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build services
        run: |
          go build -o bin/orchestrator ./services/orchestrator
          go build -o bin/metadata ./services/metadata
          go build -o bin/github-discovery ./services/github-discovery
          go build -o bin/document-processor ./services/document-processor
          go build -o bin/embedding ./services/embedding
          go build -o bin/vector-storage ./services/vector-storage
          go build -o bin/notification ./services/notification

      - name: Start metadata service
        run: |
          ./bin/metadata &
          echo "Waiting for metadata service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9086/health > /dev/null 2>&1; then
              echo "✓ Metadata service is ready"
              break
            fi
            echo "Waiting for metadata service... ($i/30)"
            sleep 2
          done
        env:
          METADATA_DB_PATH: ./data/metadata.db
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/metadata.log
          METADATA_SERVICE_PORT: 9086
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start GitHub discovery service
        run: |
          echo "Starting GitHub discovery service..."
          ./bin/github-discovery > ./logs/github-discovery-stdout.log 2>&1 &
          GITHUB_PID=$!
          echo $GITHUB_PID > ./github-discovery.pid
          echo "GitHub discovery service started with PID: $GITHUB_PID"
          
          echo "Waiting for GitHub discovery service to start..."
          for i in {1..30}; do
            # Check if process is still running
            if ! kill -0 $GITHUB_PID 2>/dev/null; then
              echo "ERROR: GitHub discovery service crashed!"
              echo "--- Stdout/Stderr log ---"
              cat ./logs/github-discovery-stdout.log 2>/dev/null || echo "No stdout log"
              echo "--- Service log ---"
              cat ./logs/github.log 2>/dev/null || echo "No service log"
              exit 1
            fi
            
            if curl -sf http://localhost:9081/health > /dev/null 2>&1; then
              echo "✓ GitHub discovery service is ready"
              break
            fi
            echo "Waiting for GitHub discovery service... ($i/30)"
            sleep 2
          done
          
          # Final check
          if ! curl -sf http://localhost:9081/health > /dev/null 2>&1; then
            echo "ERROR: GitHub discovery service failed to become healthy"
            echo "--- Stdout/Stderr log ---"
            cat ./logs/github-discovery-stdout.log 2>/dev/null || echo "No stdout log"
            echo "--- Service log ---"
            cat ./logs/github.log 2>/dev/null || echo "No service log"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          GH_FILTER_KEYWORD: ${{ secrets.GH_FILTER_KEYWORD }}
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/github.log
          GITHUB_SERVICE_PORT: 9081
          # Required by config validation
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start document processor service
        run: |
          ./bin/document-processor &
          echo "Waiting for document processor service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9082/health > /dev/null 2>&1; then
              echo "✓ Document processor service is ready"
              break
            fi
            echo "Waiting for document processor service... ($i/30)"
            sleep 2
          done
        env:
          MAX_CHUNK_SIZE: 1000
          CHUNK_OVERLAP: 200
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/document-processor.log
          DOCUMENT_PROCESSOR_PORT: 9082
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start embedding service
        run: |
          ./bin/embedding &
          echo "Waiting for embedding service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9083/health > /dev/null 2>&1; then
              echo "✓ Embedding service is ready"
              break
            fi
            echo "Waiting for embedding service... ($i/30)"
            sleep 2
          done
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/embedding.log
          EMBEDDING_SERVICE_PORT: 9083
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start vector storage service
        run: |
          ./bin/vector-storage &
          echo "Waiting for vector storage service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9084/health > /dev/null 2>&1; then
              echo "✓ Vector storage service is ready"
              break
            fi
            echo "Waiting for vector storage service... ($i/30)"
            sleep 2
          done
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_DIMENSION: 1536
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/vector-storage.log
          VECTOR_STORAGE_PORT: 9084
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

      - name: Start notification service
        run: |
          ./bin/notification &
          echo "Waiting for notification service to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:9085/health > /dev/null 2>&1; then
              echo "✓ Notification service is ready"
              break
            fi
            echo "Waiting for notification service... ($i/30)"
            sleep 2
          done
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/notification.log
          NOTIFICATION_SERVICE_PORT: 9085
          # Required by config validation
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: Start orchestrator service
        run: |
          ./bin/orchestrator &
          sleep 5
        env:
          GITHUB_SERVICE_URL: http://localhost:9081
          DOCUMENT_PROCESSOR_URL: http://localhost:9082
          EMBEDDING_SERVICE_URL: http://localhost:9083
          VECTOR_STORAGE_URL: http://localhost:9084
          NOTIFICATION_SERVICE_URL: http://localhost:9085
          METADATA_SERVICE_URL: http://localhost:9086
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ORGANIZATION: ${{ secrets.GH_ORGANIZATION }}
          GH_FILTER_KEYWORD: ${{ secrets.GH_FILTER_KEYWORD }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          LOG_LEVEL: INFO
          LOG_FILE_PATH: ./logs/orchestrator.log
          ORCHESTRATOR_PORT: 9090

      - name: Wait for services to be healthy
        run: |
          echo "Checking all services health..."
          
          # Define all services to check
          declare -A services=(
            ["metadata"]="http://localhost:9086/health"
            ["github-discovery"]="http://localhost:9081/health"
            ["document-processor"]="http://localhost:9082/health"
            ["embedding"]="http://localhost:9083/health"
            ["vector-storage"]="http://localhost:9084/health"
            ["notification"]="http://localhost:9085/health"
            ["orchestrator"]="http://localhost:9090/health"
          )
          
          all_healthy=false
          for i in {1..30}; do
            all_healthy=true
            for service in "${!services[@]}"; do
              if ! curl -sf "${services[$service]}" > /dev/null 2>&1; then
                echo "  ✗ $service not ready"
                all_healthy=false
              else
                echo "  ✓ $service is healthy"
              fi
            done
            
            if [ "$all_healthy" = true ]; then
              echo "All services are healthy!"
              break
            fi
            
            echo "Waiting for all services to be healthy... ($i/30)"
            sleep 3
          done
          
          if [ "$all_healthy" != true ]; then
            echo "ERROR: Not all services became healthy in time"
            echo "Service status:"
            for service in "${!services[@]}"; do
              if curl -sf "${services[$service]}" > /dev/null 2>&1; then
                echo "  ✓ $service: healthy"
              else
                echo "  ✗ $service: unhealthy"
                # Show logs for unhealthy services
                if [ "$service" = "github-discovery" ]; then
                  echo "--- GitHub Discovery stdout log ---"
                  cat ./logs/github-discovery-stdout.log 2>/dev/null || echo "No stdout log"
                  echo "--- GitHub Discovery service log ---"
                  tail -50 ./logs/github.log 2>/dev/null || echo "No service log"
                  echo "--- Checking if process is running ---"
                  if [ -f ./github-discovery.pid ]; then
                    PID=$(cat ./github-discovery.pid)
                    if kill -0 $PID 2>/dev/null; then
                      echo "Process $PID is still running"
                    else
                      echo "Process $PID has crashed"
                    fi
                  fi
                fi
              fi
            done
            exit 1
          fi

      - name: Trigger sync
        timeout-minutes: 20
        run: |
          INCREMENTAL="${{ github.event.inputs.incremental || 'true' }}"
          PROJECT_ID="${{ github.event.inputs.project_id || 'default' }}"
          
          echo "Starting sync (incremental: $INCREMENTAL, project: $PROJECT_ID)"
          
          # Verify orchestrator is still running before making request
          if ! curl -sf http://localhost:9090/health > /dev/null 2>&1; then
            echo "Error: Orchestrator service is not responding"
            echo '{"success": false, "errors": ["Orchestrator service is not responding before sync"]}' > sync-result.json
            exit 1
          fi
          
          # Make the sync request with extended timeout for large operations
          # --max-time 900 = 15 minutes, --connect-timeout 30 = 30 seconds for connection
          HTTP_CODE=$(curl -s -X POST "http://localhost:9090/sync?project_id=$PROJECT_ID&incremental=$INCREMENTAL" \
            -H "Content-Type: application/json" \
            --connect-timeout 30 \
            --max-time 900 \
            -o sync-result.json \
            -w "%{http_code}") || CURL_EXIT_CODE=$?
          
          CURL_EXIT_CODE=${CURL_EXIT_CODE:-0}
          echo "Curl exit code: $CURL_EXIT_CODE"
          echo "HTTP Status: $HTTP_CODE"
          
          # Check service health after sync attempt
          echo "Checking services health after sync..."
          for service in metadata:9086 github-discovery:9081 document-processor:9082 embedding:9083 vector-storage:9084 notification:9085 orchestrator:9090; do
            name="${service%:*}"
            port="${service#*:}"
            if curl -sf "http://localhost:$port/health" > /dev/null 2>&1; then
              echo "  ✓ $name is still running"
            else
              echo "  ✗ $name has crashed or is unresponsive"
            fi
          done
          
          # Handle curl-specific exit codes
          if [ $CURL_EXIT_CODE -eq 28 ]; then
            echo "Error: Sync operation timed out after 15 minutes"
            echo '{"success": false, "errors": ["Sync operation timed out - consider running with smaller scope or check service logs"]}' > sync-result.json
          elif [ $CURL_EXIT_CODE -eq 7 ]; then
            echo "Error: Failed to connect to orchestrator service"
            echo '{"success": false, "errors": ["Connection refused - orchestrator service may have crashed"]}' > sync-result.json
          elif [ $CURL_EXIT_CODE -eq 56 ]; then
            echo "Error: Connection reset by peer - service may have crashed during sync"
            echo '{"success": false, "errors": ["Connection reset - a service may have crashed during sync"]}' > sync-result.json
          elif [ ! -s sync-result.json ]; then
            echo "Error: No response received from sync endpoint"
            echo '{"success": false, "errors": ["No response from orchestrator"]}' > sync-result.json
          fi
          
          # Display the result
          cat sync-result.json | jq '.' 2>/dev/null || cat sync-result.json
          
          # Show logs if sync failed
          if [ "$HTTP_CODE" -ge 400 ] || [ "$HTTP_CODE" = "000" ] || [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "--- Orchestrator logs (last 50 lines) ---"
            tail -50 ./logs/orchestrator.log 2>/dev/null || echo "No orchestrator logs available"
            echo "--- End of logs ---"
          fi
          
          # Fail if HTTP status indicates an error or curl failed
          if [ "$HTTP_CODE" -ge 400 ] || [ "$HTTP_CODE" = "000" ] || [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Error: Sync request failed (HTTP: $HTTP_CODE, curl: $CURL_EXIT_CODE)"
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sync-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Upload sync result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sync-result-${{ github.run_number }}
          path: sync-result.json
          retention-days: 30

      - name: Check sync result
        run: |
          # Validate that sync-result.json exists and is valid JSON
          if [ ! -f sync-result.json ]; then
            echo "Error: sync-result.json not found"
            exit 1
          fi
          
          if ! jq empty sync-result.json 2>/dev/null; then
            echo "Error: sync-result.json is not valid JSON"
            cat sync-result.json
            exit 1
          fi
          
          SUCCESS=$(jq -r '.success // false' sync-result.json)
          if [ "$SUCCESS" != "true" ]; then
            echo "Sync failed!"
            echo "Errors:"
            jq -r '.errors[]? // "No error details available"' sync-result.json
            echo "Warnings:"
            jq -r '.warnings[]? // empty' sync-result.json
            exit 1
          fi
          echo "Sync completed successfully!"
          echo "Summary:"
          jq '{repositories_scanned: .repositories_scanned, files_processed: .files_processed, embeddings_generated: .embeddings_generated, duration: .duration}' sync-result.json || true

      - name: Cleanup background processes
        if: always()
        run: |
          echo "Stopping background services..."
          pkill -f "./bin/orchestrator" || true
          pkill -f "./bin/metadata" || true
          pkill -f "./bin/github-discovery" || true
          pkill -f "./bin/document-processor" || true
          pkill -f "./bin/embedding" || true
          pkill -f "./bin/vector-storage" || true
          pkill -f "./bin/notification" || true
          echo "All services stopped"

